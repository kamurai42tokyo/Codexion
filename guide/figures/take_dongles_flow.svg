<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820">
  <style>
    text { font-family: "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2933; }
    .t { font-weight: bold; font-size: 14px; }
    .m { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .s { font-size: 12px; fill: #52606d; }
    .y { font-size: 12px; fill: #1e8449; font-weight: bold; }
    .n { font-size: 12px; fill: #c0392b; font-weight: bold; }
    .box { fill: #f5f7fa; stroke: #52606d; stroke-width: 1.5; }
    .lk { fill: #fdf6e3; stroke: #b7950b; stroke-width: 1.5; }
    .ok { fill: #eafaf1; stroke: #1e8449; stroke-width: 1.5; }
    .end { fill: #fff1f0; stroke: #c0392b; stroke-width: 1.5; }
    .dia { fill: #ffffff; stroke: #52606d; stroke-width: 1.5; }
    .panel { fill: #f8fafc; stroke: #2f6fdb; stroke-width: 1.5; }
    .line { stroke: #52606d; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="820" fill="#ffffff"/>
  <text class="t" x="20" y="24">take_dongles(coder, first = right, second = left) の流れ</text>

  <!-- 1 -->
  <rect class="lk" x="175" y="40" width="310" height="50" rx="6"/>
  <text x="330" y="61" text-anchor="middle">① 2本の鍵をかける</text>
  <text class="s" x="330" y="80" text-anchor="middle">lock_dongles_mutex：アドレスが小さい方から</text>
  <line class="line" x1="330" y1="90" x2="330" y2="118" marker-end="url(#a)"/>
  <!-- 2 -->
  <rect class="box" x="200" y="120" width="260" height="50" rx="6"/>
  <text x="330" y="141" text-anchor="middle">② 申し込みを作って2本の列に入れる</text>
  <text class="s" x="330" y="160" text-anchor="middle">make_request → push_request × 2</text>
  <line class="line" x1="330" y1="170" x2="330" y2="208" marker-end="url(#a)"/>
  <!-- 3 -->
  <polygon class="dia" points="330,210 460,245 330,280 200,245"/>
  <text x="330" y="242" text-anchor="middle">③ 2本とも</text>
  <text class="m" x="330" y="259" text-anchor="middle">is_my_turn ?</text>

  <!-- no: retry branch -->
  <line class="line" x1="460" y1="245" x2="518" y2="245" marker-end="url(#a)"/>
  <text class="n" x="470" y="237">いいえ</text>
  <rect class="lk" x="520" y="222" width="180" height="46" rx="6"/>
  <text x="610" y="250" text-anchor="middle">鍵を2つとも外す</text>
  <line class="line" x1="610" y1="268" x2="610" y2="298" marker-end="url(#a)"/>
  <polygon class="dia" points="610,300 700,330 610,360 520,330"/>
  <text x="610" y="334" text-anchor="middle">stop が true ?</text>
  <line class="line" x1="700" y1="330" x2="758" y2="330" marker-end="url(#a)"/>
  <text class="y" x="712" y="322">はい</text>
  <rect class="end" x="760" y="310" width="160" height="40" rx="20"/>
  <text class="m" x="840" y="335" text-anchor="middle">return false</text>
  <line class="line" x1="610" y1="360" x2="610" y2="398" marker-end="url(#a)"/>
  <text class="n" x="620" y="384">いいえ</text>
  <rect class="lk" x="520" y="400" width="180" height="50" rx="6"/>
  <text class="m" x="610" y="421" text-anchor="middle">usleep(100)</text>
  <text class="s" x="610" y="440" text-anchor="middle">もう一度 ① と同じ順で鍵</text>
  <path class="line" d="M700,425 L730,425 L730,190 L338,190" marker-end="url(#a)"/>
  <text class="s" x="740" y="230">③ に戻る</text>
  <text class="s" x="740" y="246">（列には入れ直さない）</text>

  <!-- yes: take -->
  <line class="line" x1="330" y1="280" x2="330" y2="308" marker-end="url(#a)"/>
  <text class="y" x="340" y="298">はい</text>
  <rect class="ok" x="200" y="310" width="260" height="44" rx="6"/>
  <text x="330" y="337" text-anchor="middle">④ in_use を2本とも true にする</text>
  <line class="line" x1="330" y1="354" x2="330" y2="378" marker-end="url(#a)"/>
  <rect class="ok" x="200" y="380" width="260" height="44" rx="6"/>
  <text x="330" y="407" text-anchor="middle">⑤「has taken a dongle」を2回出す</text>
  <line class="line" x1="330" y1="424" x2="330" y2="448" marker-end="url(#a)"/>
  <rect class="ok" x="200" y="450" width="260" height="50" rx="6"/>
  <text x="330" y="471" text-anchor="middle">⑥ 2本の列から自分を消す</text>
  <text class="s" x="330" y="490" text-anchor="middle">remove_request × 2</text>
  <line class="line" x1="330" y1="500" x2="330" y2="528" marker-end="url(#a)"/>
  <rect class="end" x="200" y="530" width="260" height="44" rx="22"/>
  <text x="330" y="557" text-anchor="middle">⑦ 鍵を外して return true</text>

  <!-- is_my_turn panel -->
  <rect class="panel" x="20" y="610" width="920" height="196" rx="8"/>
  <text class="t" x="40" y="638">is_my_turn(coder, dongle)：上から順に調べて、最初に当てはまった答えを返す（turn.c）</text>
  <text class="m" x="40" y="668">1.</text><text x="64" y="668">列が空（request_count が 0）</text><text class="n" x="560" y="668">→ false</text>
  <text class="m" x="40" y="694">2.</text><text x="64" y="694">だれかが使用中（in_use が true）</text><text class="n" x="560" y="694">→ false</text>
  <text class="m" x="40" y="720">3.</text><text x="64" y="720">クールダウン中（今の時刻 − released_at &lt; dongle_cooldown）</text><text class="n" x="560" y="720">→ false</text>
  <text class="m" x="40" y="746">4.</text><text x="64" y="746">列の先頭 request_queue[0].id が自分の id か？</text><text class="y" x="560" y="746">→ 自分なら true、違えば false</text>
  <text class="s" x="40" y="780">released_at の初期値は 0（1970年）なので、始まった直後のドングルはクールダウン中にならない。</text>
  <text class="s" x="40" y="798">2本を「同時に」確かめてから取るので、1本だけ持って待ち続ける（デッドロックの原因になる）状態が起きない。</text>
</svg>
