<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580">
  <style>
    text { font-family: "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2933; }
    .t { font-weight: bold; font-size: 14px; }
    .m { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .s { font-size: 12px; fill: #52606d; }
    .y { font-size: 12px; fill: #1e8449; font-weight: bold; }
    .n { font-size: 12px; fill: #c0392b; font-weight: bold; }
    .box { fill: #f5f7fa; stroke: #52606d; stroke-width: 1.5; }
    .w { fill: #fff1f0; stroke: #c0392b; stroke-width: 1.5; }
    .rd { fill: #e6f0ff; stroke: #2f6fdb; stroke-width: 1.5; }
    .flag { fill: #fdf6e3; stroke: #b7950b; stroke-width: 2; }
    .group { fill: #f8fafc; stroke: #2f6fdb; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .lk { fill: #fdf6e3; stroke: #b7950b; stroke-width: 1.5; }
    .dia { fill: #ffffff; stroke: #52606d; stroke-width: 1.5; }
    .line { stroke: #52606d; stroke-width: 1.5; fill: none; }
    .red { stroke: #c0392b; stroke-width: 1.5; fill: none; }
    .blue { stroke: #2f6fdb; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
  </defs>
  <rect width="980" height="580" fill="#ffffff"/>

  <!-- left: stop flag -->
  <text class="t" x="20" y="26">停止フラグ stop を「書く人」と「読む人」</text>
  <text class="n" x="20" y="50">書く（true にする：stop_simulation など）</text>
  <rect class="w" x="20" y="60" width="140" height="48" rx="6"/><text x="90" y="80" text-anchor="middle">burned out 時</text><text class="s" x="90" y="98" text-anchor="middle">print_log の中</text>
  <rect class="w" x="170" y="60" width="140" height="48" rx="6"/><text x="240" y="80" text-anchor="middle">全員が規定回数</text><text class="s" x="240" y="98" text-anchor="middle">monitor_routine</text>
  <rect class="w" x="320" y="60" width="140" height="48" rx="6"/><text x="390" y="80" text-anchor="middle">スレッド作成失敗</text><text class="s" x="390" y="98" text-anchor="middle">create_threads</text>
  <line class="red" x1="90" y1="108" x2="200" y2="168" marker-end="url(#ar)"/>
  <line class="red" x1="240" y1="108" x2="240" y2="168" marker-end="url(#ar)"/>
  <line class="red" x1="390" y1="108" x2="280" y2="168" marker-end="url(#ar)"/>

  <rect class="flag" x="140" y="170" width="200" height="56" rx="8"/>
  <text class="m" x="240" y="193" text-anchor="middle">table-&gt;stop（bool）</text>
  <text class="s" x="240" y="213" text-anchor="middle">stop_mutex で守る</text>

  <line class="blue" x1="240" y1="226" x2="240" y2="270" marker-end="url(#ab)"/>
  <rect class="group" x="20" y="272" width="440" height="176" rx="8"/>
  <text class="t" x="36" y="296" fill="#2f6fdb">読む（is_stopped で確認し、true ならやめる）</text>
  <rect class="rd" x="36" y="310" width="130" height="50" rx="6"/><text x="101" y="331" text-anchor="middle">coder のループ</text><text class="s" x="101" y="349" text-anchor="middle">coder.c</text>
  <rect class="rd" x="176" y="310" width="130" height="50" rx="6"/><text x="241" y="331" text-anchor="middle">ドングル待ち</text><text class="s" x="241" y="349" text-anchor="middle">take_dongles</text>
  <rect class="rd" x="316" y="310" width="130" height="50" rx="6"/><text x="381" y="331" text-anchor="middle">作業中の待ち</text><text class="s" x="381" y="349" text-anchor="middle">time.c</text>
  <rect class="rd" x="106" y="376" width="130" height="50" rx="6"/><text x="171" y="397" text-anchor="middle">ログを出す前</text><text class="s" x="171" y="415" text-anchor="middle">print_log</text>
  <rect class="rd" x="246" y="376" width="130" height="50" rx="6"/><text x="311" y="397" text-anchor="middle">見回りのループ</text><text class="s" x="311" y="415" text-anchor="middle">monitor_routine</text>
  <text class="s" x="20" y="476">stop は false → true の一方向だけ変わる。true から false に戻す場所はない。</text>
  <text class="s" x="20" y="496">どのスレッドも短い間隔（100µs〜1ms）で stop を見るので、すぐに止まれる。</text>

  <!-- right: print_log -->
  <text class="t" x="520" y="26">print_log(command, coder) の流れ</text>
  <rect class="box" x="540" y="40" width="280" height="40" rx="6"/>
  <text x="680" y="65" text-anchor="middle">command を表示する文に変える</text>
  <text class="s" x="680" y="96" text-anchor="middle">例："take dongle" → "has taken a dongle"</text>
  <line class="line" x1="680" y1="102" x2="680" y2="118" marker-end="url(#a)"/>
  <rect class="lk" x="540" y="120" width="280" height="40" rx="6"/>
  <text x="680" y="145" text-anchor="middle">log_mutex に鍵をかける</text>
  <line class="line" x1="680" y1="160" x2="680" y2="178" marker-end="url(#a)"/>
  <polygon class="dia" points="680,180 790,210 680,240 570,210"/>
  <text x="680" y="214" text-anchor="middle">stop が true ?</text>
  <line class="line" x1="790" y1="210" x2="828" y2="210" marker-end="url(#a)"/>
  <text class="y" x="796" y="202">はい</text>
  <rect class="box" x="830" y="186" width="130" height="48" rx="6"/>
  <text class="s" x="895" y="206" text-anchor="middle">鍵を外して</text><text class="s" x="895" y="224" text-anchor="middle">何も出さず戻る</text>
  <line class="line" x1="680" y1="240" x2="680" y2="278" marker-end="url(#a)"/>
  <text class="n" x="690" y="264">いいえ</text>
  <polygon class="dia" points="680,280 790,310 680,340 570,310"/>
  <text x="680" y="314" text-anchor="middle">"burn out" ?</text>
  <line class="line" x1="790" y1="310" x2="828" y2="310" marker-end="url(#a)"/>
  <text class="y" x="796" y="302">はい</text>
  <rect class="w" x="830" y="286" width="130" height="48" rx="6"/>
  <text class="m" x="895" y="306" text-anchor="middle">stop_simulation</text><text class="s" x="895" y="324" text-anchor="middle">stop = true</text>
  <path class="line" d="M895,334 L895,370 L688,370" marker-end="url(#a)"/>
  <line class="line" x1="680" y1="340" x2="680" y2="378" marker-end="url(#a)"/>
  <text class="n" x="690" y="362">いいえ</text>
  <rect class="box" x="540" y="380" width="280" height="44" rx="6"/>
  <text x="680" y="400" text-anchor="middle">1行出力する</text>
  <text class="m" x="680" y="416" text-anchor="middle">"&lt;経過ms&gt; &lt;id&gt; &lt;文&gt;"</text>
  <line class="line" x1="680" y1="424" x2="680" y2="442" marker-end="url(#a)"/>
  <rect class="lk" x="540" y="444" width="280" height="40" rx="6"/>
  <text x="680" y="469" text-anchor="middle">log_mutex の鍵を外す</text>

  <text class="s" x="520" y="516">「burned out」は出力の前に stop を true にする。</text>
  <text class="s" x="520" y="536">log_mutex の中で行うので、次に鍵を取ったスレッドは</text>
  <text class="s" x="520" y="556">必ず stop = true を見る → burned out のあとに何も出ない。</text>
</svg>
